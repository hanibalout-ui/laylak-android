rder:1px solid #d8c9ca;border-radius:10px;background:#fff;padding:12px;font:inherit}label{display:block;font-weight:650;margin:13px 0 6px}fieldset{border:1px solid #e1d5d4;border-radius:12px;padding:10px;margin:12px 0}legend{font-weight:700;color:var(--wine)}.choice{display:flex;align-items:center;gap:9px;padding:9px 4px;border-bottom:1px solid #eee}.choice:last-child{border:0}.choice input{accent-color:var(--wine);width:18px;height:18px}.choice span{flex:1}.pill{display:inline-block;border-radius:40px;padding:6px 10px;background:#eee0e8;color:var(--wine);font-size:12px}.step{color:var(--wine);font-weight:750;font-size:13px}.notice{background:#fff3da;border-radius:12px;padding:12px;font-size:13px;line-height:1.5}.qty{display:flex;align-items:center;gap:10px}.qty button{padding:5px 12px}.total{font-size:20px;font-weight:800;color:var(--wine)}.hidden{display:none}.overlay{position:fixed;inset:0;background:#0008;z-index:10;display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:760px;max-height:90vh;overflow:auto;background:var(--cream);padding:20px;border-radius:20px 20px 0 0}.tag{background:#f3e6d5;padding:4px 7px;border-radius:7px;font-size:12px} .small{font-size:12px} .w100{width:100%} .flex{display:flex;gap:8px;flex-wrap:wrap} .sectiontitle{font-weight:700;color:var(--wine);margin-top:18px}a{color:var(--wine)}

/* Laylak V4 — refined mobile-first visual system */
:root{--cream:#f7f0e5;--lilac:#bca7c8;--gold:#bb9860;--wine:#713e53;--ink:#332c30}
body{background:linear-gradient(180deg,#f9f4ed 0%,#f4eadc 100%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
header{padding:18px 20px 16px;background:#713e53;border-bottom:3px solid #bd9b68;box-shadow:0 5px 20px #492c3820}
header b{font-size:30px;letter-spacing:4px;font-weight:500}
header small{font-size:9px;letter-spacing:2px;margin-top:3px}
header button.light{background:#f6eadd;border-radius:15px;min-width:56px;min-height:47px}
main{padding:22px 17px 120px;max-width:690px;min-height:calc(100vh - 175px)}
h1,h2{letter-spacing:-.35px}h1{font-size:29px;line-height:1.17}h2{font-size:23px}
.hero{background:linear-gradient(135deg,#f0e2d1 0%,#e7d9e4 100%);border:1px solid #e5d4c2;border-radius:25px;padding:27px 22px;position:relative;overflow:hidden;box-shadow:0 8px 26px #5d3a4c10}
.hero:after{content:'✦';position:absolute;right:12px;top:-33px;font-size:135px;color:#fff8;pointer-events:none}
.hero>*{position:relative;z-index:1}.hero h1{max-width:300px;margin-top:18px}.hero p{max-width:320px;color:#67545b}
.card{border:1px solid #ece2d8;border-radius:21px;box-shadow:0 7px 24px #57384a0b;padding:19px}
button{border-radius:13px;min-height:43px;font-weight:650;transition:filter .15s ease,transform .12s ease}
button:active{transform:scale(.98)}button.light{background:#e9dce7;color:#603349}button.outline{border-color:#bda8b1}
.grid{gap:12px}.grid button{min-height:88px;padding:16px;border-radius:17px;box-shadow:0 4px 14px #5335480a}
.grid button.light{background:#fffdf9;border:1px solid #eaded6;color:#6e4156;text-align:left}
.tabs{gap:9px;scrollbar-width:none;padding:8px 0 17px}.tabs::-webkit-scrollbar{display:none}.tabs button{border-radius:50px;padding:10px 15px;box-shadow:0 2px 8px #00000009}
.item{padding:18px 0;gap:14px}.item strong{display:block;font-size:15px;line-height:1.4}.item button{font-size:13px;flex-shrink:0}.price{margin-top:6px;font-size:16px}
.pill{background:#fff9ef;border:1px solid #d7b985;color:#744b4b;font-size:11px;letter-spacing:.3px;padding:7px 12px}
.notice{background:#fff8e9;border:1px solid #ead9b7;color:#705b48;border-radius:15px}
.field{border:1px solid #d9c9ca;border-radius:13px;min-height:48px}.field:focus{outline:2px solid #bca7c8;outline-offset:1px}
fieldset{background:#fffdf9;border-radius:17px;border-color:#e9ded8;padding:13px}legend{padding:0 8px}
.choice{padding:12px 4px}.choice input{width:20px;height:20px}
nav{border-top:1px solid #eee0db;box-shadow:0 -5px 22px #4c304b15;padding:7px 5px calc(7px + env(safe-area-inset-bottom));gap:3px}
nav button{font-size:10px;line-height:1.35;padding:9px 2px;border-radius:12px;min-height:54px;background:transparent;color:#775767}
nav button.active{background:#eadde7;color:#603349;font-weight:800}
.sheet{background:#fbf5ec;border-radius:26px 26px 0 0;padding:24px 19px;box-shadow:0 -12px 40px #0002}
.total{font-size:23px}.tag{background:#f0e4e9;color:#694358}
@media(min-width:650px){main{padding:28px 24px 125px}.hero{padding:35px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* V5 illustrated restaurant cards, offline-friendly */
.food-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:12px 0 24px}
.food-card{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center!important;background:#fffaf5!important;border:1px solid #e7d9d0;color:#573b4a!important;min-height:190px!important;padding:10px 8px 14px!important;box-shadow:0 7px 18px #5d405015!important;overflow:hidden}
.food-card .food-art{width:100%;height:124px;margin-bottom:8px}
.food-card .food-name{font-weight:750;font-size:13px;line-height:1.25}
.food-art{display:block;flex-shrink:0}

.item-with-art .food-art{width:70px;height:70px}
.item-with-art .item-info{min-width:0}
.item-with-art strong{font-size:14px}
.item-with-art .price{font-size:15px}

.builder-banner .food-art{width:96px;height:96px}
.builder-banner button{margin-top:8px}
.hero-illustration{position:absolute;right:-14px;top:14px;width:130px;height:130px;opacity:.85}
.hero h1,.hero p{max-width:73%}
@media(max-width:380px){.food-card{min-height:165px!important}.food-card .food-art{height:105px}.hero h1,.hero p{max-width:100%}.hero-illustration{opacity:.18}}

/* V6 category and item visual popups */
.overlay{align-items:center;padding:12px}.sheet{border-radius:24px;max-height:86dvh;padding:18px;overscroll-behavior:contain}
.popup-head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-18px;background:#fbf5ec;padding:12px 0;z-index:2}
.popup-art{width:160px;height:140px;margin:0 auto 10px}.popup-product{display:flex;align-items:center;gap:12px;border-bottom:1px solid #e9ded8;padding:12px 0}.popup-product .food-art{width:72px;height:72px}.popup-product-info{flex:1;min-width:0}.popup-product-info strong{display:block;font-size:14px}.popup-product-info .price{font-size:14px}.popup-product button{font-size:12px;padding:9px 10px}.popup-title{color:#713e53;margin:0;font-size:22px}.popup-footer{font-size:12px;color:#765c67;margin-top:12px}.popup-choice-art{width:120px;height:110px;margin:0 auto}.food-card:focus-visible{outline:3px solid #713e53;outline-offset:2px}
</style></head><body><header><div><b>LAYLAK</b><small>SHAWARMA & FALAFEL · AUGSBURG</small></div><button class="light" onclick="go('cart')">🛍 <span id="cartcount">0</span></button></header><main id="app"><div class="card"><h2>Willkommen bei Laylak</h2><p>Speisekarte · Selbst zusammenstellen · Tisch reservieren</p></div></main><nav id="nav"></nav><div id="modal"></div><script>

const eur=n=>Number(n).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
let cart=read('laylak_v3_cart',[]),customPrices=read('laylak_v3_prices',{}),view='home',category='shawarma',modalItem=null,builder={base:'wrap',filling:'shawarma',sauce:['knoblauch'],veggies:[],extras:[],qty:1},book={};
const itemPrice=p=>Object.prototype.hasOwnProperty.call(customPrices,p.id)?customPrices[p.id]:p.price;
const menuItem=id=>catalog.flatMap(c=>c.items).find(p=>p.id===id);
function save(){try{localStorage.setItem('laylak_v3_cart',JSON.stringify(cart))}catch(e){};document.getElementById('cartcount').textContent=cart.reduce((s,x)=>s+x.qty,0)}
function go(v){view=v;document.getElementById('modal').innerHTML='';render();window.scrollTo(0,0)}

// Illustrated food icons are embedded SVG: no network connection or image files needed.
const foodSymbols={shawarma:'🌯',tacos:'🌮',burger:'🍔',chicken:'🍗',veg:'🧆',pizza:'🍕',pide:'🥙',manakish:'🫓',salads:'🥗',sauces:'🥣',drinks:'🥤',desserts:'🍮'};
const foodBg={shawarma:['#f6e5c9','#d7b08c'],tacos:['#f8e8d2','#dfb9a0'],burger:['#eee0da','#d5b2a9'],chicken:['#f5e8cf','#e6c598'],veg:['#e9ead7','#b8c7a3'],pizza:['#f7e1d5','#e5b2a0'],pide:['#f0e2d5','#d5b69c'],manakish:['#eee8d7','#d4c6a4'],salads:['#e5ecdd','#b4c8ac'],sauces:['#f2e5dd','#d4b5ac'],drinks:['#e5ddec','#c5b2d8'],desserts:['#f6e8d7','#e1c1a2']};
function art(id){const em=foodSymbols[id]||'🍽️',colors=foodBg[id]||foodBg.shawarma;return `<svg class="food-art" role="img" aria-label="Illustration" viewBox="0 0 160 130" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="g_${id}" cx="38%" cy="28%" r="75%"><stop stop-color="${colors[0]}"/><stop offset="1" stop-color="${colors[1]}"/></radialGradient><filter id="s_${id}"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#5c3b3b" flood-opacity=".19"/></filter></defs><ellipse cx="80" cy="110" rx="49" ry="9" fill="#5c3b3b" opacity=".12"/><circle cx="80" cy="60" r="54" fill="url(#g_${id})"/><circle cx="80" cy="60" r="48" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/><text x="80" y="87" text-anchor="middle" font-size="72" filter="url(#s_${id})">${em}</text><circle cx="128" cy="22" r="4" fill="#c5a46d"/><circle cx="30" cy="93" r="3" fill="#fff"/></svg>`}

function render(){const app=document.getElementById('app');document.getElementById('nav').innerHTML=[['home','⌂ Start'],['menu','☰ Menü'],['build','✦ Selbst machen'],['booking','▦ Tisch'],['cart','🛍 Warenkorb']].map(([id,label])=>`<button class="${view===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('');
if(view==='home')app.innerHTML=`<div class="hero">${art('shawarma').replace('class="food-art"','class="food-art hero-illustration"')}<span class="pill">Willkommen bei Laylak</span><h1>Orientalischer Genuss, frisch für dich.</h1><p>Shawarma, Falafel und mehr – ganz nach deinem Geschmack.</p><div class="flex"><button onclick="go('menu')">Speisekarte ansehen</button></div></div><div class="builder-banner">${art('tacos')}<div><strong>Stell dir dein Essen zusammen</strong><div class="muted">Wähle Füllung, Gemüse & Sauce</div><button onclick="go('build')">Jetzt selbst machen ✦</button></div></div><h2>Unsere Spezialitäten</h2><div class="food-grid">${catalog.map(c=>`<button class="food-card" onclick="openCategory('${c.id}')">${art(c.id)}<span class="food-name">${safe(c.name)}</span></button>`).join('')}</div><div class="grid"><button onclick="go('booking')">▦ Tisch reservieren</button><button onclick="go('cart')">🛍 Warenkorb ansehen</button></div>`;
if(view==='menu'){const c=catalog.find(x=>x.id===category)||catalog[0];app.innerHTML=`<h1>Speisekarte</h1><div class="notice">Preise mit „Preis folgt“ sind noch nicht freigegeben und können vorerst nicht bestellt werden. Alle Preise und Zutaten bitte vor dem Livegang prüfen.</div><div class="tabs">${catalog.map(x=>`<button class="${x.id===category?'active':''}" onclick="openCategory('${x.id}')">${safe(x.name)}</button>`).join('')}</div><div class="card"><div class="row">${art(c.id).replace('class="food-art"','class="food-art" style="width:100px;height:95px"')}<h2>${safe(c.name)}</h2></div>${c.items.map(p=>{let price=itemPrice(p);return `<div class="item row"><div class="item-with-art">${art(c.id)}<div class="item-info"><strong>${safe(p.name)}</strong><div class="price">${price===null?'Preis folgt':eur(price)}</div></div></div><button ${price===null?'disabled':''} onclick="openItem('${p.id}')">Anpassen +</button></div>`}).join('')}</div>`}

if(view==='cart')renderCart(app);

function openCategory(id){
 const c=catalog.find(x=>x.id===id);if(!c)return;
 category=id;
 document.getElementById('modal').innerHTML=`<div class="overlay" onclick="closeModal(event)"><section class="sheet" role="dialog" aria-modal="true" aria-label="${safe(c.name)}"><div class="popup-head"><h2 class="popup-title">${safe(c.name)}</h2><button class="light" onclick="closeModal()" aria-label="Schließen">✕</button></div><div class="popup-art">${art(c.id)}</div><div class="muted" style="text-align:center">Wähle dein Lieblingsgericht</div>${c.items.map(p=>{let price=itemPrice(p);return `<div class="popup-product">${art(c.id)}<div class="popup-product-info"><strong>${safe(p.name)}</strong><div class="price">${price===null?'Preis folgt':eur(price)}</div></div><button ${price===null?'disabled':''} onclick="openItem('${p.id}')">Auswählen</button></div>`}).join('')}<p class="popup-footer">Preise und Allergene vor dem Livegang prüfen.</p></section></div>`;
}
function openItem(id){modalItem=id;const p=menuItem(id),price=itemPrice(p);if(price===null)return;document.getElementById('modal').innerHTML=`<div class="overlay" onclick="closeModal(event)"><div class="sheet"><div class="popup-head"><h2>${safe(p.name)}</h2><button class="light" onclick="closeModal()">✕</button></div><div class="popup-choice-art">${art(catalog.find(c=>c.items.some(x=>x.id===p.id))?.id||'shawarma')}</div><div class="muted">${eur(price)} · Bitte Zutaten und Allergene vor Bestellung prüfen.</div><label>Extras</label><label class="choice"><input id="itemfalafel" type="checkbox"> <span>2 zusätzliche Falafel</span><b>+1,00 €</b></label><label class="choice"><input id="itemcheese" type="checkbox"> <span>Extra Käse</span><b>+1,00 €</b></label><label>Anmerkung</label><input class="field" id="itemnote" placeholder="Ohne Zwiebeln ..."><label>Menge</label><input class="field" id="itemqty" type="number" min="1" max="30" value="1"><p><button class="w100" onclick="addItem()">In den Warenkorb</button></p></div></div>`}
function closeModal(e){if(!e||e.target.classList.contains('overlay'))document.getElementById('modal').innerHTML=''}
function addItem(){const p=menuItem(modalItem),ex=[];if(document.getElementById('itemfalafel').checked)ex.push('2 Falafel (+1 €)');if(document.getElementById('itemcheese').checked)ex.push('Käse (+1 €)');let q=Math.max(1,Math.min(30,Number(document.getElementById('itemqty').value)||1));cart.push({id:Date.now()+'-'+Math.random(),name:p.name,price:itemPrice(p)+ex.length,qty:q,details:ex.concat(document.getElementById('itemnote').value||[]).filter(Boolean).join(', ')});closeModal();save();go('cart')}
const bases=[['wrap','Wrap / Sandwich',7],['taco','Tacos',7],['plate','Teller',null],['bowl','Bowl',null]];
const fillings=[['shawarma','Hähnchen-Shawarma',0],['falafel','Falafel',0],['vegetable','Gemüse',0],['halloumi','Halloumi',null],['crispy','Crispy Chicken',null]];
const sauces=[['knoblauch','Knoblauch'],['mango','Mango'],['avocado','Avocado'],['laylak','Laylak'],['scharf','Scharf'],['ohne','Ohne Sauce']];
const vegetables=[['salat','Salat'],['tomaten','Tomaten'],['gurken','Gurken'],['zwiebeln','Zwiebeln'],['pickles','Essiggurken']];
const addOns=[['falafel','2 Extra-Falafel',1],['cheese','Extra Käse',1],['vegetable','Extra Gemüse',2]];
const sel=(arr,v)=>arr.find(x=>x[0]===v);
function buildPrice(){let b=sel(bases,builder.base),f=sel(fillings,builder.filling);if(b[2]===null||f[2]===null)return null;return b[2]+f[2]+builder.extras.reduce((s,id)=>s+(sel(addOns,id)?.[2]||0),0)}
function updateBuilder(field,value,multi=false){if(multi){const a=builder[field];builder[field]=a.includes(value)?a.filter(x=>x!==value):[...a,value]}else builder[field]=value;if(field==='sauce'&&value==='ohne')builder.sauce=['ohne'];if(field==='sauce'&&value!=='ohne')builder.sauce=builder.sauce.filter(x=>x!=='ohne');render()}
function choices(field,arr,multi=false){return `<fieldset><legend>${field==='base'?'1. Grundlage':field==='filling'?'2. Füllung':field==='veggies'?'3. Gemüse':field==='sauce'?'4. Saucen':'5. Extras'}</legend>${arr.map(x=>`<label class="choice"><input type="${multi?'checkbox':'radio'}" name="${field}" ${multi?builder[field].includes(x[0])?'checked':'':builder[field]===x[0]?'checked':''} onchange="updateBuilder('${field}','${x[0]}',${multi})"><span>${safe(x[1])}</span>${x.length>2?`<b class="small">${x[2]===null?'Preis folgt':x[2]===0?'inkl.':`+${eur(x[2])}`}</b>`:''}</label>`).join('')}</fieldset>`}
function renderBuilder(app){let price=buildPrice();app.innerHTML=`<h1>Stell dir dein Essen zusammen</h1><p class="muted">Wähle deine Zutaten Schritt für Schritt. Der Preis wird automatisch berechnet, sobald die Grundpreise bestätigt sind.</p>${choices('base',bases)}${choices('filling',fillings)}${choices('veggies',vegetables.map(x=>[...x]),true)}${choices('sauce',sauces,true)}${choices('extras',addOns,true)}<div class="card"><div class="row"><strong>Dein Wunschgericht</strong><strong class="total">${price===null?'Preis folgt':eur(price*builder.qty)}</strong></div><p class="muted">${safe(sel(bases,builder.base)[1])} · ${safe(sel(fillings,builder.filling)[1])}</p><div class="row"><span>Menge</span><div class="qty"><button onclick="builder.qty=Math.max(1,builder.qty-1);render()">−</button><b>${builder.qty}</b><button onclick="builder.qty++;render()">+</button></div></div><p><button class="w100" ${price===null?'disabled':''} onclick="addCustom()">Wunschgericht hinzufügen</button></p></div><div class="notice">Individuelle Gerichte sind ein Entwurf. Basispreise und mögliche Kombinationen müssen vom Restaurant freigegeben werden.</div>`}
function addCustom(){let p=buildPrice();if(p===null)return;let desc=[sel(fillings,builder.filling)[1],...builder.veggies.map(x=>sel(vegetables,x)[1]),...builder.sauce.map(x=>sel(sauces,x)[1]),...builder.extras.map(x=>sel(addOns,x)[1])].join(', ');cart.push({id:Date.now()+'-'+Math.random(),name:'Wunschgericht: '+sel(bases,builder.base)[1],details:desc,price:p,qty:builder.qty});save();go('cart')}
function renderCart(app){let total=cart.reduce((s,x)=>s+x.price*x.qty,0);app.innerHTML=`<h1>Warenkorb</h1>${cart.length?`<div class="card">${cart.map((x,i)=>`<div class="item"><div class="row"><strong>${safe(x.name)}</strong><b>${eur(x.price*x.qty)}</b></div><p class="muted">${safe(x.details||'')}</p><div class="row"><div class="qty"><button class="light" onclick="changeQty(${i},-1)">−</button><b>${x.qty}</b><button class="light" onclick="changeQty(${i},1)">+</button></div><button class="outline" onclick="cart.splice(${i},1);save();render()">Entfernen</button></div></div>`).join('')}<div class="row"><strong>Zwischensumme</strong><strong class="total">${eur(total)}</strong></div></div><label>Bestellart</label><select class="field" id="orderType"><option>Abholung</option><option>Lieferung (Gebühr noch offen)</option></select><label>Name</label><input class="field" id="orderName" placeholder="Name"><label>Telefon</label><input class="field" id="orderPhone" placeholder="Telefonnummer"><label>Adresse / Hinweise</label><textarea class="field" id="orderNotes" rows="2"></textarea><p><button class="w100" onclick="copyOrder()">Bestellentwurf kopieren</button></p><div class="notice">Keine echte Bestellung: Die Angaben werden nicht an Laylak gesendet. Liefergebühren und Zahlung sind noch nicht eingerichtet.</div>`:`<div class="card"><p>Dein Warenkorb ist leer.</p><button onclick="go('menu')">Zur Speisekarte</button> <button class="light" onclick="go('build')">Selbst machen</button></div>`}`}
function changeQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);save();render()}
async function copyText(t){try{await navigator.clipboard.writeText(t);alert('Entwurf kopiert')}catch{prompt('Text kopieren:',t)}}
function copyOrder(){let name=document.getElementById('orderName').value,phone=document.getElementById('orderPhone').value;if(!name||!phone){alert('Bitte Name und Telefonnummer eingeben');return}copyText('LAYLAK – BESTELLENTWURF (NICHT GESENDET)\n'+cart.map(x=>`${x.qty} × ${x.name} – ${eur(x.price*x.qty)} (${x.details||'-'})`).join('\n')+'\nSumme: '+eur(cart.reduce((s,x)=>s+x.price*x.qty,0))+'\nBestellart: '+document.getElementById('orderType').value+'\nName: '+name+'\nTelefon: '+phone+'\nHinweise: '+document.getElementById('orderNotes').value)}
function renderBooking(app){app.innerHTML=`<h1>Tisch reservieren</h1><div class="card"><label>Name</label><input id="bn" class="field" placeholder="Vor- und Nachname"><label>Telefon</label><input id="bp" class="field" type="tel" placeholder="Telefonnummer"><label>Datum</label><input id="bd" class="field" type="date"><label>Uhrzeit</label><input id="bt" class="field" type="time" value="19:00"><label>Personen</label><input id="bg" class="field" type="number" min="1" max="200" value="2"><label>Art der Anfrage</label><select id="bk" class="field"><option>Tischreservierung</option><option>Feier / Gruppe ab 25 Personen</option></select><label>Wünsche</label><textarea id="bw" class="field" rows="3" placeholder="Anlass, Menüwünsche ..."></textarea><p><button class="w100" onclick="copyBooking()">Reservierungsanfrage kopieren</button></p></div><div class="notice">Nur Entwurf: keine Verfügbarkeitsprüfung, keine Übermittlung und keine bestätigte Reservierung.</div>`}
function copyBooking(){const val=id=>document.getElementById(id).value;if(!val('bn')||!val('bp')||!val('bd')){alert('Bitte Name, Telefon und Datum eingeben');return}copyText('LAYLAK – RESERVIERUNGSENTWURF (NICHT GESENDET)\nName: '+val('bn')+'\nTelefon: '+val('bp')+'\nDatum: '+val('bd')+'\nUhrzeit: '+val('bt')+'\nPersonen: '+val('bg')+'\nArt: '+val('bk')+'\nWünsche: '+val('bw'))}
function renderAdmin(app){app.innerHTML=`<h1>Preise bearbeiten (lokal)</h1><div class="notice">Nur für den privaten Test: kein Login, keine sichere Verwaltung. Änderungen gelten nur in diesem Browser.</div>${catalog.map(c=>`<div class="card"><h2>${safe(c.name)}</h2>${c.items.map(p=>`<label>${safe(p.name)}</label><input class="field" type="number" min="0" step="0.5" id="price_${p.id}" placeholder="Preis fehlt" value="${itemPrice(p)??''}">`).join('')}</div>`).join('')}<button class="w100" onclick="savePrices()">Preise lokal speichern</button>`}
function savePrices(){catalog.flatMap(c=>c.items).forEach(p=>{let v=document.getElementById('price_'+p.id).value;if(v!=='')customPrices[p.id]=Number(v)});try{localStorage.setItem('laylak_v3_prices',JSON.stringify(customPrices))}catch(e){};alert('Lokal gespeichert');go('menu')}
try{render()}catch(e){document.getElementById('app').innerHTML='<div class="card"><h2>Anzeigeproblem</h2><p>Bitte die aktuelle Version neu öffnen.</p></div>';console.error(e)}</script></body></html>
